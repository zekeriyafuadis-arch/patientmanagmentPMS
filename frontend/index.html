<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Dr Amin Specialty Dental Clinic — Patient and appointment management">
    <meta name="theme-color" content="#0891b2">
    <title>Dr Amin Specialty Dental Clinic | PMS</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦷</text></svg>">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js for Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Main Stylesheet -->
   <link rel="stylesheet" href="src/styles/root.css">
    <link rel="stylesheet" href="src/styles/ui-layout.css">
    <link rel="stylesheet" href="src/styles/nav-pill.css">
    <link rel="stylesheet" href="src/styles/dashboard.css">
    <link rel="stylesheet" href="src/styles/patients.css">
    <link rel="stylesheet" href="src/styles/patientRegister.css">
    <link rel="stylesheet" href="src/styles/patientSearch.css">
    <link rel="stylesheet" href="src/styles/patientDetail.css">
    <link rel="stylesheet" href="src/styles/patientEdit.css">
    <link rel="stylesheet" href="src/styles/login.css">
    <link rel="stylesheet" href="src/styles/settings.css">
    <link rel="stylesheet" href="src/styles/appointments.css">
    <link rel="stylesheet" href="src/styles/dental.css">
    <link rel="stylesheet" href="src/styles/billing.css">
    <link rel="stylesheet" href="src/styles/recalls.css">
    <link rel="stylesheet" href="src/styles/dark-mode.css">
    <link rel="stylesheet" href="src/styles/global-search.css">
    <link rel="stylesheet" href="src/styles/clinic-alerts.css">
    <link rel="stylesheet" href="src/styles/responsive.css">
</head>
<body>
    <!-- Auth screen (login / setup) -->
    <div id="auth-screen">
        <div class="auth-loading">
            <div class="loading-spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <div id="app-shell" class="app-container hidden">
        <!-- Top Bar with Controls -->
        <div class="top-bar" id="topBar">
            <div class="top-bar-left">
                <div class="app-title">
                    <i class="fas fa-tooth"></i>
                    <span>Dr Amin Dental</span>
                </div>
            </div>
            <div class="top-bar-center">
                <button type="button" class="global-search-trigger" id="globalSearchBtn" title="Search patients (Ctrl+K)">
                    <i class="fas fa-search"></i>
                    <span>Search patients…</span>
                    <kbd>Ctrl+K</kbd>
                </button>
                <button type="button" class="top-bar-quick-btn outline" id="quickNewApptBtn" title="New appointment">
                    <i class="fas fa-calendar-plus"></i>
                    <span class="hide-mobile">Appt</span>
                </button>
                <button type="button" class="top-bar-quick-btn" id="quickNewPatientBtn" title="Register patient (Ctrl+N)">
                    <i class="fas fa-user-plus"></i>
                    <span class="hide-mobile">Patient</span>
                </button>
            </div>
            <div class="top-bar-right">
                <!-- Theme Toggle -->
                <button class="top-bar-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode">
                    <i class="fas fa-moon"></i>
                </button>
                
                <!-- Fullscreen Toggle -->
                <button class="top-bar-btn" id="fullscreenToggleBtn" title="Toggle Fullscreen (F11)">
                    <i class="fas fa-expand"></i>
                </button>
                
                <!-- Clinic alerts (reception/admin) -->
                <button class="top-bar-btn top-bar-btn-badge" id="clinicAlertsBtn" title="Clinic alerts" style="display:none;">
                    <i class="fas fa-bell"></i>
                    <span class="top-bar-badge hidden" id="clinicAlertsBadge">0</span>
                </button>

                <!-- Settings -->
                <button class="top-bar-btn" id="settingsBtn" title="Settings">
                    <i class="fas fa-cog"></i>
                </button>
                
                <!-- User Info -->
                <div class="user-info" id="userInfo" title="Click to sign out">
                    <i class="fas fa-user-circle"></i>
                    <div>
                        <span id="userDisplayName">Staff</span>
                        <span class="user-role" id="userDisplayRole"></span>
                    </div>
                    <button class="logout-btn" id="logoutBtn" title="Sign out" aria-label="Sign out">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>

        <nav class="pill-nav" id="pillNav" aria-label="Main navigation">
            <div class="pill-nav-scroll">
                <div class="pill-nav-wrapper">
                    <div class="pill-nav-indicator" aria-hidden="true"></div>
                    <ul class="nav-menu">
                        <li data-page="dashboard" class="active">
                            <i class="fas fa-chart-line"></i>
                            <span>Dashboard</span>
                        </li>
                        <li data-page="patients">
                            <i class="fas fa-users"></i>
                            <span>Patients</span>
                        </li>
                        <li data-page="register">
                            <i class="fas fa-user-plus"></i>
                            <span>Register</span>
                        </li>
                        <li data-page="search">
                            <i class="fas fa-search"></i>
                            <span>Search</span>
                        </li>
                        <li data-page="appointments">
                            <i class="fas fa-calendar-alt"></i>
                            <span>Appointments</span>
                        </li>
                        <li data-page="billing">
                            <i class="fas fa-file-invoice-dollar"></i>
                            <span>Billing</span>
                        </li>
                        <li data-page="recalls">
                            <i class="fas fa-bell"></i>
                            <span>Recalls</span>
                            <span class="nav-badge hidden" id="recallsNavBadge">0</span>
                        </li>
                        <li data-page="settings">
                            <i class="fas fa-cog"></i>
                            <span>Settings</span>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <!-- Main Content Area -->
        <main class="main-content">
            <div id="content-area">
                <!-- Dynamic content will be loaded here -->
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p>Loading Dr Amin Specialty Dental Clinic…</p>
                </div>
            </div>
        </main>
    </div><!-- /#app-shell -->

    <div id="clinicAlertsPanel" class="clinic-alerts-panel hidden" aria-hidden="true">
        <div class="clinic-alerts-header">
            <h3><i class="fas fa-bell"></i> Clinic Alerts</h3>
            <button type="button" class="btn-secondary btn-sm" id="markAllAlertsRead">Mark all read</button>
            <button type="button" class="modal-close" id="closeClinicAlerts">&times;</button>
        </div>
        <div id="clinicAlertsList" class="clinic-alerts-list"></div>
    </div>
    
    <!-- Global Search -->
    <div id="globalSearchOverlay" class="global-search-overlay" aria-hidden="true">
        <div class="global-search-panel" role="dialog" aria-label="Search">
            <div class="global-search-header">
                <i class="fas fa-search"></i>
                <input type="search" id="globalSearchInput" placeholder="Search patients, or type to navigate…" autocomplete="off">
                <span class="global-search-kbd">ESC</span>
                <button type="button" class="modal-close" id="globalSearchClose" aria-label="Close">&times;</button>
            </div>
            <div id="globalSearchResults" class="global-search-results"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay" style="display: none;">
        <div class="settings-modal">
            <div class="modal-header">
                <h3>
                    <i class="fas fa-cog"></i>
                    Settings
                </h3>
                <button class="modal-close" id="closeSettingsBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h4>Appearance</h4>
                    <div class="setting-item">
                        <label>Theme Mode</label>
                        <div class="theme-selector">
                            <button class="theme-option" data-theme="light">
                                <i class="fas fa-sun"></i>
                                Light
                            </button>
                            <button class="theme-option" data-theme="dark">
                                <i class="fas fa-moon"></i>
                                Dark
                            </button>
                            <button class="theme-option" data-theme="auto">
                                <i class="fas fa-adjust"></i>
                                Auto
                            </button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="autoFullscreenSetting">
                            Auto Fullscreen on Startup
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="rememberWindowState">
                            Remember Window State
                        </label>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h4>Display</h4>
                    <div class="setting-item">
                        <label>Default View</label>
                        <select id="defaultView">
                            <option value="dashboard">Dashboard</option>
                            <option value="patients">All Patients</option>
                            <option value="register">Register Patient</option>
                            <option value="search">Advanced Search</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="showAnimations">
                            Enable Animations
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="compactMode">
                            Compact Mode (Smaller UI)
                        </label>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h4>Data & Backup</h4>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="autoBackup">
                            Auto Backup Database (Daily)
                        </label>
                    </div>
                    <div class="setting-item">
                        <button class="btn-secondary" id="exportDataBtn">
                            <i class="fas fa-download"></i> Export All Data
                        </button>
                        <button class="btn-danger" id="clearCacheBtn">
                            <i class="fas fa-trash"></i> Clear Cache
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="saveSettingsBtn">Save Settings</button>
                <button class="btn-secondary" id="cancelSettingsBtn">Cancel</button>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>
    
    <!-- Main Application Script -->
    <script src="src/main.js" type="module"></script>
</body>
</html>
